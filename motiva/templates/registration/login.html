{% extends "base.html" %}
{% block title %}Sign in | Motiva{% endblock %}
{% block content %}
<section>
  <h1>Sign in to Motiva</h1>
  <p>Check in with one learning goal and choose a manageable next step.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
